<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORTUNEX · Lucky Draw</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap');

*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
-webkit-touch-callout: none;
-webkit-user-select: none;
user-select: none;
}

:root {
–violet: #8B5CF6;
–violet-bright: #A78BFA;
–violet-glow: rgba(139, 92, 246, 0.6);
–gold: #F59E0B;
–gold-bright: #FCD34D;
–gold-glow: rgba(245, 158, 11, 0.5);
–black: #030305;
–dark: #0A0A12;
–card-dark: #0F0F1A;
–glass: rgba(255,255,255,0.04);
–glass-border: rgba(255,255,255,0.08);
–text-primary: #F0EEFF;
–text-muted: rgba(240,238,255,0.45);
–font-display: ‘Cormorant Garamond’, Georgia, serif;
–font-ui: ‘Rajdhani’, sans-serif;
}

html, body {
width: 100%;
height: 100%;
overflow: hidden;
overscroll-behavior: none;
-webkit-overflow-scrolling: touch;
background: var(–black);
touch-action: none;
}

body {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
}

/* ─── SCREEN SYSTEM ─── */
.screen {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
opacity: 0;
pointer-events: none;
transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
overflow: hidden;
}
.screen.active {
opacity: 1;
pointer-events: all;
}

/* ─── ANIMATED BACKGROUND ─── */
.bg-canvas {
position: absolute;
inset: 0;
background: var(–black);
overflow: hidden;
}

.bg-orb {
position: absolute;
border-radius: 50%;
filter: blur(80px);
opacity: 0.18;
animation: orbFloat 8s ease-in-out infinite;
}
.bg-orb.o1 {
width: 60vw; height: 60vw;
background: var(–violet);
top: -20%; left: -20%;
animation-duration: 9s;
}
.bg-orb.o2 {
width: 50vw; height: 50vw;
background: var(–gold);
bottom: -15%; right: -15%;
animation-duration: 11s;
animation-delay: -4s;
}
.bg-orb.o3 {
width: 40vw; height: 40vw;
background: #2563EB;
top: 40%; left: 30%;
animation-duration: 13s;
animation-delay: -7s;
}

@keyframes orbFloat {
0%, 100% { transform: translate(0,0) scale(1); }
33% { transform: translate(6%, 4%) scale(1.08); }
66% { transform: translate(-4%, 6%) scale(0.95); }
}

/* grid shimmer */
.bg-grid {
position: absolute;
inset: 0;
background-image:
linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
background-size: 40px 40px;
mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 40%, transparent 100%);
-webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 40%, transparent 100%);
}

/* shimmer particles */
.shimmer-field {
position: absolute;
inset: 0;
overflow: hidden;
pointer-events: none;
}
.shimmer-particle {
position: absolute;
width: 2px; height: 2px;
background: white;
border-radius: 50%;
opacity: 0;
animation: shimmerBlink var(–d, 3s) ease-in-out var(–delay, 0s) infinite;
}

@keyframes shimmerBlink {
0%, 100% { opacity: 0; transform: scale(1); }
50% { opacity: var(–peak, 0.6); transform: scale(2); }
}

/* ─── SCREEN 1: HOOK ─── */
#screen1 .content {
position: relative;
z-index: 2;
display: flex;
flex-direction: column;
align-items: center;
gap: 0;
text-align: center;
padding: 0 32px;
}

.logo-badge {
font-family: var(–font-ui);
font-size: 11px;
font-weight: 700;
letter-spacing: 0.4em;
color: var(–gold);
opacity: 0.8;
text-transform: uppercase;
margin-bottom: 36px;
padding: 6px 16px;
border: 1px solid rgba(245,158,11,0.25);
border-radius: 20px;
background: rgba(245,158,11,0.06);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
animation: fadeSlideUp 1s 0.3s both;
}

.hero-title {
font-family: var(–font-display);
font-size: clamp(52px, 15vw, 82px);
font-weight: 700;
line-height: 0.9;
color: var(–text-primary);
letter-spacing: -0.02em;
margin-bottom: 12px;
animation: fadeSlideUp 1s 0.5s both;
}
.hero-title span {
background: linear-gradient(135deg, var(–violet-bright), var(–gold-bright));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.hero-sub {
font-family: var(–font-ui);
font-size: 14px;
font-weight: 500;
letter-spacing: 0.25em;
color: var(–text-muted);
text-transform: uppercase;
margin-bottom: 64px;
animation: fadeSlideUp 1s 0.7s both;
}

.start-btn {
position: relative;
font-family: var(–font-ui);
font-size: 13px;
font-weight: 700;
letter-spacing: 0.35em;
text-transform: uppercase;
color: var(–black);
background: linear-gradient(135deg, var(–violet-bright), var(–gold-bright));
border: none;
border-radius: 60px;
padding: 20px 48px;
cursor: pointer;
outline: none;
-webkit-appearance: none;
animation: fadeSlideUp 1s 0.9s both, btnPulse 2.5s 1.9s ease-in-out infinite;
transition: transform 0.15s, box-shadow 0.15s;
box-shadow:
0 0 40px var(–violet-glow),
0 0 80px rgba(139,92,246,0.2),
0 4px 20px rgba(0,0,0,0.5);
}
.start-btn::before {
content: ‘’;
position: absolute;
inset: -2px;
border-radius: 62px;
background: linear-gradient(135deg, var(–violet), var(–gold));
z-index: -1;
opacity: 0.5;
filter: blur(12px);
animation: btnPulse 2.5s ease-in-out infinite;
}
.start-btn:active {
transform: scale(0.94);
box-shadow: 0 0 20px var(–violet-glow), 0 2px 8px rgba(0,0,0,0.5);
}

@keyframes btnPulse {
0%, 100% { box-shadow: 0 0 40px var(–violet-glow), 0 0 80px rgba(139,92,246,0.2), 0 4px 20px rgba(0,0,0,0.5); }
50% { box-shadow: 0 0 60px rgba(167,139,250,0.8), 0 0 120px rgba(139,92,246,0.4), 0 4px 20px rgba(0,0,0,0.5); }
}

.start-mystery {
font-family: var(–font-display);
font-size: 16px;
font-style: italic;
color: var(–text-muted);
margin-top: 24px;
letter-spacing: 0.05em;
animation: fadeSlideUp 1s 1.1s both;
}

/* ─── SCREEN 2: CARD GAME ─── */
#screen2 {
background: var(–dark);
}

.game-header {
position: relative;
z-index: 2;
text-align: center;
padding: 0 24px;
margin-bottom: 40px;
}

.game-eyebrow {
font-family: var(–font-ui);
font-size: 10px;
font-weight: 700;
letter-spacing: 0.45em;
color: var(–gold);
text-transform: uppercase;
opacity: 0.7;
margin-bottom: 10px;
}

.game-title {
font-family: var(–font-display);
font-size: clamp(26px, 8vw, 38px);
font-weight: 700;
color: var(–text-primary);
line-height: 1.1;
}

.game-subtitle {
font-family: var(–font-ui);
font-size: 13px;
color: var(–text-muted);
letter-spacing: 0.1em;
margin-top: 8px;
}

/* Cards arena */
.cards-arena {
position: relative;
z-index: 2;
display: flex;
align-items: center;
justify-content: center;
gap: 16px;
perspective: 1200px;
width: 100%;
padding: 0 16px;
}

.card-wrap {
flex: 0 0 auto;
width: calc(30vw);
max-width: 115px;
aspect-ratio: 2/3;
cursor: pointer;
perspective: 600px;
}

.card-inner {
position: relative;
width: 100%;
height: 100%;
transform-style: preserve-3d;
transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
border-radius: 12px;
}

.card-wrap.flipped .card-inner {
transform: rotateY(180deg);
}

.card-face {
position: absolute;
inset: 0;
border-radius: 12px;
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
overflow: hidden;
}

/* CARD BACK */
.card-back {
background: linear-gradient(160deg, #1a1030 0%, #0d0918 100%);
border: 1.5px solid rgba(139,92,246,0.3);
box-shadow:
0 8px 32px rgba(0,0,0,0.6),
0 0 0 1px rgba(255,255,255,0.04) inset,
0 1px 0 rgba(255,255,255,0.08) inset;
display: flex;
align-items: center;
justify-content: center;
}

.card-back-pattern {
position: absolute;
inset: 6px;
border: 1px solid rgba(139,92,246,0.2);
border-radius: 8px;
background-image:
repeating-linear-gradient(45deg, rgba(139,92,246,0.06) 0px, rgba(139,92,246,0.06) 1px, transparent 1px, transparent 8px),
repeating-linear-gradient(-45deg, rgba(139,92,246,0.06) 0px, rgba(139,92,246,0.06) 1px, transparent 1px, transparent 8px);
}

.card-back-logo {
position: relative;
z-index: 2;
font-family: var(–font-display);
font-size: 28px;
color: rgba(139,92,246,0.5);
font-weight: 700;
font-style: italic;
}

/* CARD FRONT */
.card-front {
background: #FAFAF7;
border-radius: 12px;
transform: rotateY(180deg);
display: flex;
flex-direction: column;
align-items: stretch;
justify-content: space-between;
padding: 8px;
box-shadow: 0 8px 32px rgba(0,0,0,0.7);
}

.card-corner {
display: flex;
flex-direction: column;
align-items: center;
line-height: 1;
}
.card-corner.tl { align-self: flex-start; }
.card-corner.br { align-self: flex-end; transform: rotate(180deg); }

.card-rank {
font-family: Georgia, ‘Times New Roman’, serif;
font-size: clamp(16px, 5vw, 22px);
font-weight: 700;
color: #111;
line-height: 1;
}
.card-suit-corner {
font-size: clamp(10px, 3vw, 14px);
line-height: 1;
color: #111;
}

.card-center {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
}
.card-center-suit {
font-size: clamp(36px, 12vw, 54px);
line-height: 1;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
}

/* Joker cards */
.card-front.joker {
background: linear-gradient(160deg, #F5F3FF, #EDE9FE);
}
.card-front.joker .card-rank,
.card-front.joker .card-suit-corner {
color: #7C3AED;
}

/* ─── GAME STATUS ─── */
.game-status {
position: relative;
z-index: 2;
text-align: center;
margin-top: 32px;
height: 50px;
display: flex;
align-items: center;
justify-content: center;
}

.status-text {
font-family: var(–font-ui);
font-size: 14px;
font-weight: 600;
letter-spacing: 0.1em;
color: var(–text-muted);
text-transform: uppercase;
transition: opacity 0.3s;
}

/* ─── SUCCESS BANNER ─── */
.success-overlay {
position: absolute;
inset: 0;
z-index: 10;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: rgba(3,3,5,0.88);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
opacity: 0;
pointer-events: none;
transition: opacity 0.5s;
}
.success-overlay.visible {
opacity: 1;
pointer-events: all;
}

.success-emoji {
font-size: 64px;
margin-bottom: 16px;
animation: bounceIn 0.5s cubic-bezier(0.68,-0.55,0.27,1.55);
}
.success-title {
font-family: var(–font-display);
font-size: 36px;
font-weight: 700;
color: var(–gold-bright);
letter-spacing: 0.05em;
margin-bottom: 8px;
text-align: center;
}
.success-sub {
font-family: var(–font-ui);
font-size: 13px;
letter-spacing: 0.2em;
color: var(–text-muted);
text-transform: uppercase;
margin-bottom: 36px;
}

.progress-track {
width: 220px;
height: 4px;
background: rgba(255,255,255,0.1);
border-radius: 4px;
overflow: hidden;
}
.progress-fill {
height: 100%;
width: 0%;
background: linear-gradient(90deg, var(–violet), var(–gold));
border-radius: 4px;
transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* confetti canvas */
#confettiCanvas {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 9;
}

/* ─── SCREEN 3: RICKROLL ─── */
#screen3 {
background: var(–black);
}

.prize-splash {
position: absolute;
inset: 0;
z-index: 5;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: var(–black);
gap: 24px;
transition: opacity 0.5s;
}

.prize-splash.hidden {
opacity: 0;
pointer-events: none;
}

.prize-icon {
font-size: 64px;
animation: bounceFloat 1s ease-in-out infinite alternate;
}

@keyframes bounceFloat {
from { transform: translateY(0); }
to { transform: translateY(-10px); }
}

.prize-text {
font-family: var(–font-display);
font-size: 28px;
font-weight: 700;
color: var(–text-primary);
letter-spacing: 0.05em;
}

.spinner {
width: 36px; height: 36px;
border: 3px solid rgba(139,92,246,0.2);
border-top-color: var(–violet-bright);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.yt-frame {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
border: none;
z-index: 4;
opacity: 0;
transition: opacity 0.6s;
}
.yt-frame.visible {
opacity: 1;
}

/* ─── CARD DEAL ANIMATIONS ─── */
.card-wrap {
opacity: 0;
transform: translateY(-120px) scale(0.8);
}
.card-wrap.dealt {
opacity: 1;
transform: translateY(0) scale(1);
transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
}
.card-wrap.dealt:nth-child(1) { transition-delay: 0s; }
.card-wrap.dealt:nth-child(2) { transition-delay: 0.12s; }
.card-wrap.dealt:nth-child(3) { transition-delay: 0.24s; }

/* Shuffle slide */
.card-wrap.shuffle-left {
transition: transform 0.35s cubic-bezier(0.4,0,0.2,1) !important;
transform: translateX(-60px) !important;
}
.card-wrap.shuffle-right {
transition: transform 0.35s cubic-bezier(0.4,0,0.2,1) !important;
transform: translateX(60px) !important;
}
.card-wrap.shuffle-reset {
transition: transform 0.35s cubic-bezier(0.4,0,0.2,1) !important;
transform: translateX(0) !important;
}

/* press feedback on cards */
.card-wrap.pressable:active {
transform: scale(0.94) !important;
}

/* ─── ANIMATIONS ─── */
@keyframes fadeSlideUp {
from { opacity: 0; transform: translateY(24px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes bounceIn {
from { opacity: 0; transform: scale(0.3); }
to { opacity: 1; transform: scale(1); }
}

/* highlight chosen card */
.card-wrap.chosen .card-inner {
box-shadow: 0 0 0 3px var(–gold), 0 0 30px var(–gold-glow);
border-radius: 12px;
}

/* instruction pulse */
.pulse-hint {
animation: hintPulse 1.5s ease-in-out infinite;
}
@keyframes hintPulse {
0%, 100% { opacity: 0.5; }
50% { opacity: 1; }
}
</style>

</head>

<script>
// ─── prevent all scroll/bounce ───
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => {
  if (e.target.closest('.card-wrap, .start-btn')) return;
  e.preventDefault();
}, { passive: false });

// ─── shimmer particles ───
(function() {
  const field = document.getElementById('shimmerField');
  for (let i = 0; i < 55; i++) {
    const p = document.createElement('div');
    p.className = 'shimmer-particle';
    p.style.cssText = `
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --d:${2.5+Math.random()*4}s;
      --delay:${Math.random()*5}s;
      --peak:${0.3+Math.random()*0.6};
    `;
    field.appendChild(p);
  }
})();

// ─── Screen transitions ───
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.pointerEvents = 'none';
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  el.style.pointerEvents = 'all';
}

// ─── Screen 1 → 2 ───
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('touchend', function(e) {
  e.preventDefault();
  startGame();
});

function startGame() {
  showScreen('screen2');
  setTimeout(dealCards, 300);
}

// ─── Card Game Logic ───
const cards = [
  document.getElementById('card0'),
  document.getElementById('card1'),
  document.getElementById('card2'),
];

// Initial card data — aceIdx = 0
let aceIdx = 0;
const cardData = [
  { rank: 'A', suit: '♠', color: '#111', center: '♠', isAce: true },
  { rank: 'K', suit: '♥', color: '#C0392B', center: '♥', isAce: false },
  { rank: '7', suit: '♦', color: '#C0392B', center: '♦', isAce: false },
];

function setCardFace(idx, data) {
  const cf = document.getElementById('cardFront'+idx);
  const r = document.getElementById('rank'+idx);
  const s = document.getElementById('suit'+idx);
  const rb = document.getElementById('rank'+idx+'b');
  const sb = document.getElementById('suit'+idx+'b');
  const cs = document.getElementById('centerSuit'+idx);
  r.textContent = data.rank;
  r.style.color = data.color;
  s.textContent = data.suit;
  s.style.color = data.color;
  rb.textContent = data.rank;
  rb.style.color = data.color;
  sb.textContent = data.suit;
  sb.style.color = data.color;
  cs.textContent = data.center;
  cs.style.color = data.color;
}

// init faces
cardData.forEach((d, i) => setCardFace(i, d));

function dealCards() {
  document.getElementById('gameSubtitle').textContent = 'Memorise the Ace of Spades…';
  document.getElementById('statusText').textContent = 'Watch carefully…';
  cards.forEach((c, i) => {
    c.classList.remove('dealt','flipped','pressable','chosen','shuffle-left','shuffle-right','shuffle-reset');
    c.style.transform = '';
    c.style.transition = '';
    c.style.opacity = '';
    c.style.pointerEvents = 'none';
  });

  setTimeout(() => {
    cards.forEach(c => c.classList.add('dealt'));
    // Flip face up after deal
    setTimeout(() => {
      cards.forEach(c => c.classList.add('flipped'));
      document.getElementById('gameSubtitle').textContent = 'Remember it — then they shuffle!';
      // flip back down
      setTimeout(() => {
        cards.forEach(c => c.classList.remove('flipped'));
        setTimeout(doShuffle, 500);
      }, 1600);
    }, 700);
  }, 100);
}

function doShuffle() {
  document.getElementById('statusText').textContent = 'Shuffling…';
  document.getElementById('gameSubtitle').textContent = 'Can you track it?';

  const shuffleSequence = [
    [[0,2],[1]],
    [[1],[0,2]],
    [[0,1],[2]],
    [[2],[0,1]],
    [[0,2],[1]],
  ];

  let step = 0;
  function nextStep() {
    if (step >= shuffleSequence.length) {
      // done
      setTimeout(enablePick, 400);
      return;
    }
    const [lefts, rights] = shuffleSequence[step];
    cards.forEach((c,i) => {
      c.classList.remove('shuffle-left','shuffle-right','shuffle-reset');
      if (lefts.includes(i)) c.classList.add('shuffle-left');
      else if (rights.includes(i)) c.classList.add('shuffle-right');
    });
    step++;
    setTimeout(() => {
      cards.forEach(c => {
        c.classList.remove('shuffle-left','shuffle-right');
        c.classList.add('shuffle-reset');
      });
      setTimeout(nextStep, 380);
    }, 380);
  }
  nextStep();
}

function enablePick() {
  document.getElementById('statusText').textContent = '↑  Tap your card  ↑';
  document.getElementById('gameSubtitle').textContent = 'Pick a card. Find the Ace.';
  cards.forEach((c) => {
    c.classList.add('pressable');
    c.style.pointerEvents = 'auto';
    c.style.cursor = 'pointer';
  });
  cards.forEach((c, i) => {
    c.addEventListener('touchend', onCardPick, { once: true });
    c.addEventListener('click', onCardPick, { once: true });
  });
}

function onCardPick(e) {
  e.preventDefault();
  const cardEl = e.currentTarget;
  const picked = cards.indexOf(cardEl);

  // remove listeners from others
  cards.forEach(c => {
    c.style.pointerEvents = 'none';
    c.removeEventListener('touchend', onCardPick);
    c.removeEventListener('click', onCardPick);
  });

  cardEl.classList.add('chosen');
  document.getElementById('statusText').textContent = '✦';

  // Always show ace on picked card — swap card face data secretly
  setCardFace(picked, { rank: 'A', suit: '♠', color: '#111', center: '♠', isAce: true });

  setTimeout(() => {
    cardEl.classList.add('flipped');
    setTimeout(showSuccess, 700);
  }, 250);
}

function showSuccess() {
  startConfetti();
  const overlay = document.getElementById('successOverlay');
  overlay.classList.add('visible');
  // progress bar
  setTimeout(() => {
    document.getElementById('progressFill').style.width = '100%';
  }, 80);
  // go to screen 3
  setTimeout(() => {
    stopConfetti();
    goToRickroll();
  }, 2000);
}

// ─── Confetti ───
let confettiAnim;
const confettiCanvas = document.getElementById('confettiCanvas');
const ctx = confettiCanvas.getContext('2d');
let particles = [];

function startConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  particles = [];
  const colors = ['#A78BFA','#FCD34D','#F59E0B','#8B5CF6','#FFFFFF','#34D399'];
  for (let i=0; i<120; i++) {
    particles.push({
      x: Math.random() * confettiCanvas.width,
      y: -10 - Math.random() * 100,
      w: 6 + Math.random()*6,
      h: 3 + Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random()-0.5)*4,
      vy: 3 + Math.random()*5,
      rot: Math.random()*360,
      rotV: (Math.random()-0.5)*8,
      opacity: 1,
    });
  }
  function draw() {
    ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotV;
      p.vy += 0.15;
      if (p.y > confettiCanvas.height - 30) p.opacity -= 0.04;
    });
    particles = particles.filter(p => p.opacity > 0);
    confettiAnim = requestAnimationFrame(draw);
  }
  draw();
}

function stopConfetti() {
  cancelAnimationFrame(confettiAnim);
  ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
}

// ─── Screen 3: Rick Roll ───
function goToRickroll() {
  showScreen('screen3');
  const splash = document.getElementById('prizeSplash');
  const frame = document.getElementById('ytFrame');
  // Load iframe after splash
  setTimeout(() => {
    frame.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0&playsinline=1';
    frame.classList.add('visible');
    setTimeout(() => {
      splash.classList.add('hidden');
    }, 600);
  }, 1100);
}
