<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>You've Been Selected</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@200;300;400;500;600;700&family=DM+Mono:wght@300;400&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

:root{
–black:#030305;–deep:#08081a;–surface:#0c0c1a;
–violet:#8b5cf6;–violet-dim:#6d28d9;
–gold:#c9a84c;–gold-light:#e8d48b;
–text:rgba(255,255,255,0.92);–text-dim:rgba(255,255,255,0.35);
–glass-border:rgba(255,255,255,0.07);
}

html{height:100%;height:100dvh;overflow:hidden}
body{
height:100%;height:100dvh;width:100vw;overflow:hidden;
background:var(–black);color:var(–text);
font-family:‘DM Sans’,system-ui,sans-serif;
position:fixed;inset:0;
overscroll-behavior:none;-webkit-overflow-scrolling:auto;touch-action:none;
}

.screen{
position:absolute;inset:0;width:100%;height:100%;height:100dvh;
display:none;flex-direction:column;align-items:center;justify-content:center;
overflow:hidden;z-index:1;
}
.screen.active{display:flex}

/* ===== WIPE ===== */
.wipe{position:fixed;inset:0;z-index:1000;pointer-events:none}
.wipe-p{position:absolute;top:0;width:50%;height:100%;background:var(–deep);transform:scaleX(0);will-change:transform}
.wipe-p.l{left:0;transform-origin:left}
.wipe-p.r{right:0;transform-origin:right}
.wipe.closing .wipe-p{animation:wC .42s cubic-bezier(.76,0,.24,1) forwards}
.wipe.opening .wipe-p{animation:wO .42s cubic-bezier(.76,0,.24,1) forwards}
@keyframes wC{to{transform:scaleX(1)}}
@keyframes wO{to{transform:scaleX(0)}}
.wipe-ico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1001;opacity:0;pointer-events:none;font-size:1.8rem;color:var(–gold)}
.wipe.closing .wipe-ico{animation:iI .2s .34s ease-out forwards}
.wipe.opening .wipe-ico{animation:iO .12s ease-in forwards}
@keyframes iI{to{opacity:1}}
@keyframes iO{to{opacity:0}}

/* ===== SCREEN 1 ===== */
#screen1{background:var(–black)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%}

.s1{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2.2rem;padding:0 2rem}

.s1-eye{
font-family:‘DM Mono’,monospace;font-weight:300;font-size:.62rem;
letter-spacing:.5em;text-transform:uppercase;color:var(–gold);
opacity:0;animation:fu .8s .4s ease-out forwards;
}
.s1-h{
font-family:‘Instrument Serif’,serif;font-weight:400;
font-size:clamp(2.6rem,8.5vw,4rem);text-align:center;
line-height:1.05;letter-spacing:-.02em;color:var(–text);
opacity:0;animation:fu .8s .6s ease-out forwards;
}
.s1-h em{font-style:italic;color:var(–gold-light)}

.s1-btn{
position:relative;width:152px;height:152px;border-radius:50%;border:none;
cursor:pointer;background:transparent;
opacity:0;animation:fu .8s .8s ease-out forwards;
display:flex;align-items:center;justify-content:center;
}
.s1-ring{
position:absolute;inset:0;border-radius:50%;
border:1px solid rgba(139,92,246,0.2);
animation:rp 3s ease-in-out infinite;
}
.s1-ring:nth-child(2){inset:-14px;border-color:rgba(139,92,246,0.08);animation-delay:.7s}
.s1-ring:nth-child(3){inset:-28px;border-color:rgba(139,92,246,0.04);animation-delay:1.4s}
@keyframes rp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.35}}

.s1-core{
width:100%;height:100%;border-radius:50%;
background:radial-gradient(circle at 45% 38%,rgba(139,92,246,0.12),transparent 65%),
radial-gradient(circle,var(–surface),var(–black));
border:1px solid rgba(139,92,246,0.18);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
box-shadow:0 0 50px rgba(139,92,246,0.1),inset 0 1px 0 rgba(255,255,255,0.03);
transition:transform .1s ease,box-shadow .25s ease;
}
.s1-btn:active .s1-core{transform:scale(.93);box-shadow:0 0 60px rgba(139,92,246,0.3),inset 0 0 25px rgba(139,92,246,0.12)}
.s1-lbl{font-weight:600;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase}
.s1-sub{font-weight:200;font-size:.52rem;letter-spacing:.18em;color:var(–text-dim)}

.s1-btn::before{
content:’’;position:absolute;width:190px;height:190px;border-radius:50%;
background:radial-gradient(circle,rgba(139,92,246,0.1),transparent 70%);
animation:ap 4s ease-in-out infinite;pointer-events:none;
}
@keyframes ap{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.15);opacity:1}}

.s1-foot{
font-family:‘Instrument Serif’,serif;font-style:italic;
font-size:.95rem;color:var(–text-dim);
opacity:0;animation:fu .8s 1s ease-out forwards;
}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== SCREEN 2 ===== */
#screen2{background:var(–black)}
.s2-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 40%,rgba(139,92,246,0.035),transparent)}

.s2-hdr{position:absolute;top:0;left:0;right:0;padding:clamp(3rem,10vw,5rem) 2rem 1rem;text-align:center;z-index:5;transition:opacity .4s ease}
.s2-hdr h2{
font-family:‘Instrument Serif’,serif;font-weight:400;
font-size:clamp(1.6rem,5vw,2.2rem);color:var(–text);letter-spacing:-.01em;
opacity:0;animation:fu .7s .15s ease-out forwards;
}
.s2-hdr p{font-weight:300;font-size:.78rem;color:var(–text-dim);margin-top:.35rem;letter-spacing:.04em;opacity:0;animation:fu .7s .3s ease-out forwards}

.card-table{position:relative;width:100%;max-width:420px;height:260px;display:flex;align-items:center;justify-content:center;z-index:5}

.card-slot{
position:absolute;width:105px;height:152px;
perspective:900px;cursor:pointer;will-change:transform;
}
.card-inner{
position:relative;width:100%;height:100%;
transform-style:preserve-3d;
transition:transform .55s cubic-bezier(.4,0,.2,1);
}
.card-inner.flipped{transform:rotateY(180deg)}

.card-face{
position:absolute;inset:0;border-radius:10px;
-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;
}

.card-back{
background:linear-gradient(160deg,#12103a,#0a0820);
border:1px solid rgba(139,92,246,0.14);
box-shadow:0 10px 40px rgba(0,0,0,0.7),inset 0 0 0 .5px rgba(255,255,255,0.03);
display:flex;align-items:center;justify-content:center;
}
.card-back-in{
width:82%;height:86%;border-radius:7px;
border:1px solid rgba(139,92,246,0.07);
background:
repeating-conic-gradient(rgba(139,92,246,0.025) 0% 25%,transparent 0% 50%) 0 0/11px 11px,
radial-gradient(circle,rgba(139,92,246,0.04),transparent 70%);
display:flex;align-items:center;justify-content:center;
}
.card-back-in::after{content:‘♠’;font-size:1.5rem;color:rgba(139,92,246,0.1)}

.card-front{
transform:rotateY(180deg);
background:linear-gradient(175deg,#fefdf5,#f2edd5);
border:1px solid #cec5a0;box-shadow:0 10px 40px rgba(0,0,0,0.5);
display:flex;flex-direction:column;padding:7px;
}
.cc{display:flex;flex-direction:column;align-items:center;line-height:1}
.cc-r{font-family:‘Instrument Serif’,serif;font-weight:400;font-size:1.05rem}
.cc-s{font-size:.72rem;margin-top:-1px}
.cc.bot{align-self:flex-end;margin-top:auto;transform:rotate(180deg)}
.cc-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.5rem}
.card-front.red{color:#b91c1c}
.card-front.black{color:#111827}

/* Video face */
.card-vid{
transform:rotateY(180deg);background:#000;border-radius:10px;
overflow:hidden;position:absolute;inset:0;
-webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.card-vid iframe{width:100%;height:100%;border:none;border-radius:10px}

/* Tell */
.card-slot.tell .card-back{
box-shadow:0 10px 40px rgba(0,0,0,0.7),0 0 18px rgba(201,168,76,0.06),inset 0 0 0 .5px rgba(255,255,255,0.03);
border-color:rgba(201,168,76,0.1);
}

.card-slot.shuffling{filter:blur(.35px)}

/* ===== CONFETTI ===== */
.conf-box{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf-p{position:absolute;top:-15px;animation:cd linear forwards}
@keyframes cd{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}85%{opacity:1}100%{transform:translateY(100dvh) rotate(600deg) scale(.4);opacity:0}}

/* ===== SUCCESS ===== */
.suc-ov{
position:absolute;inset:0;z-index:20;
display:none;flex-direction:column;align-items:center;justify-content:center;
background:rgba(3,3,5,0.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
padding:2rem;gap:1.8rem;
}
.suc-ov.on{display:flex}

.suc-t{
font-family:‘Instrument Serif’,serif;font-weight:400;
font-size:clamp(1.5rem,5.5vw,2.1rem);text-align:center;color:var(–gold-light);
animation:pi .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pi{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

.pw{width:min(80%,260px);display:flex;flex-direction:column;gap:.45rem}
.pt{width:100%;height:3px;border-radius:10px;background:rgba(255,255,255,0.05);overflow:hidden}
.pf{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(–violet),var(–gold));transition:width 75ms linear}
.pp{font-family:‘DM Mono’,monospace;font-weight:300;font-size:.68rem;color:var(–text-dim);text-align:center;font-variant-numeric:tabular-nums}
.ps{font-family:‘DM Mono’,monospace;font-weight:300;font-size:.58rem;color:rgba(255,255,255,0.2);text-align:center;letter-spacing:.03em;min-height:1em}

/* ===== SCREEN 3 ===== */
#screen3{background:#000}
.fs-vid{position:absolute;inset:0}
.fs-vid iframe{width:100%;height:100%;border:none}

/* ===== TOAST ===== */
.toast{
position:fixed;top:clamp(3rem,10vw,5rem);left:50%;
transform:translateX(-50%) translateY(-100%);z-index:999;
background:rgba(12,12,26,0.92);border:1px solid var(–glass-border);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
padding:.5rem 1.2rem;border-radius:100px;
font-weight:400;font-size:.72rem;color:var(–text);white-space:nowrap;
box-shadow:0 8px 30px rgba(0,0,0,0.5);
transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;opacity:0;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.v-pulse{animation:vp .1s ease-out}
@keyframes vp{0%{filter:brightness(1)}50%{filter:brightness(1.5)}100%{filter:brightness(1)}}
</style>

</head>
<body>

<div class="wipe" id="wipe"><div class="wipe-p l"></div><div class="wipe-p r"></div><div class="wipe-ico">♠</div></div>
<div class="toast" id="toast"></div>

<div class="screen active" id="screen1">
<canvas id="bgCanvas"></canvas>
<div class="s1">
  <div class="s1-eye">Exclusive Access</div>
  <h1 class="s1-h">You've Been<br><em>Selected</em></h1>
  <button class="s1-btn" id="startBtn">
    <div class="s1-ring"></div><div class="s1-ring"></div><div class="s1-ring"></div>
    <div class="s1-core">
      <span class="s1-lbl">Start</span>
      <span class="s1-sub">tap to begin</span>
    </div>
  </button>
  <p class="s1-foot">Think you're lucky?</p>
</div>
</div>

<div class="screen" id="screen2">
<div class="s2-bg"></div>
<div class="s2-hdr" id="s2hdr">
  <h2>Find the Ace</h2>
  <p>Pick a card. Win a prize.</p>
</div>
<div class="card-table" id="cardTable"></div>
<div class="suc-ov" id="sucOv">
  <div class="suc-t">🎉 You found it</div>
  <div class="pw">
    <div class="pt"><div class="pf" id="pf"></div></div>
    <div class="pp" id="pp">0%</div>
    <div class="ps" id="ps"></div>
  </div>
</div>
</div>

<div class="screen" id="screen3">
<div class="fs-vid" id="fsVid"></div>
</div>

<div class="conf-box" id="confBox"></div>

<script>
const VID='xvFZjo5PgG0';
let aCtx=null,scr=1,rTaps=0,rTimer=null;

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
window.addEventListener('scroll',()=>window.scrollTo(0,0));
document.addEventListener('dblclick',e=>e.preventDefault());

function ea(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume()}
function ns(d,v,f){
  ea();const n=aCtx.sampleRate*d,b=aCtx.createBuffer(1,n,aCtx.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=aCtx.createBufferSource();s.buffer=b;
  const fl=aCtx.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f||800;fl.Q.value=.5;
  const g=aCtx.createGain();g.gain.setValueAtTime(v||.04,aCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,aCtx.currentTime+d);
  s.connect(fl);fl.connect(g);g.connect(aCtx.destination);s.start();s.stop(aCtx.currentTime+d);
}
function sShuf(){for(let i=0;i<3;i++)setTimeout(()=>ns(.04,.025,3000+Math.random()*2000),i*45)}
function sFlip(){ns(.06,.04,3800)}
function sTick(){
  ea();const o=aCtx.createOscillator();o.type='square';o.frequency.value=1100;
  const g=aCtx.createGain();g.gain.setValueAtTime(.02,aCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,aCtx.currentTime+.02);
  o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+.02);
}
function sChime(){
  ea();[523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    setTimeout(()=>{const o=aCtx.createOscillator();o.type='sine';o.frequency.value=f;
    const g=aCtx.createGain();g.gain.setValueAtTime(.06,aCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,aCtx.currentTime+.4);
    o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+.4)},i*100);
  });
}
function sHit(){ns(.1,.07,180)}

function hap(p){if(navigator.vibrate)navigator.vibrate(p)}
function hTap(){hap(10)}
function hSuc(){hap([20,35,20,35,45])}
function vP(el){el.classList.remove('v-pulse');void el.offsetWidth;el.classList.add('v-pulse')}

function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms||1500)}
function rTap(){rTaps++;clearTimeout(rTimer);rTimer=setTimeout(()=>rTaps=0,700);if(rTaps>=5){rTaps=0;toast('Nice try 😏');hap([12,25,12])}}

// Canvas
function initC(){
  const c=document.getElementById('bgCanvas'),x=c.getContext('2d');let w,h;
  function sz(){w=c.width=innerWidth;h=c.height=innerHeight}sz();addEventListener('resize',sz);
  const ps=Array.from({length:35},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.1+.3,a:Math.random()*.2+.04,cl:Math.random()>.8?'201,168,76':'139,92,246'}));
  let t=0;
  !function d(){if(scr!==1)return;t+=.004;x.clearRect(0,0,w,h);
  const g1=x.createRadialGradient(w/2+Math.sin(t)*80,h/2+Math.cos(t*.7)*60,0,w/2,h/2,Math.max(w,h)*.6);
  g1.addColorStop(0,'rgba(139,92,246,0.05)');g1.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g1;x.fillRect(0,0,w,h);
  const g2=x.createRadialGradient(w/2+Math.cos(t*1.2)*100,h/2+Math.sin(t*.8)*80,0,w/2,h/2,Math.max(w,h)*.4);
  g2.addColorStop(0,'rgba(201,168,76,0.025)');g2.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g2;x.fillRect(0,0,w,h);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
  x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=`rgba(${p.cl},${p.a+Math.sin(t*2+p.x*.01)*.06})`;x.fill()});
  requestAnimationFrame(d)}();
}

function wipeT(fn){const w=document.getElementById('wipe');w.className='wipe closing';setTimeout(()=>{fn();w.className='wipe opening';setTimeout(()=>w.className='wipe',480)},560)}
function showScr(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen'+n).classList.add('active');scr=n}

// ===== CARDS =====
const CDS=[{r:'A',s:'♠',c:'black'},{r:'K',s:'♥',c:'red'},{r:'Q',s:'♦',c:'red'}];
let slots=[0,1,2],phase='idle';
const SX=[-125,0,125];
function cEl(i){return document.querySelector(`[data-ci="${i}"]`)}

function buildC(){
  const t=document.getElementById('cardTable');t.innerHTML='';slots=[0,1,2];
  CDS.forEach((c,i)=>{
    const e=document.createElement('div');e.className='card-slot';e.dataset.ci=i;
    e.innerHTML=`<div class="card-inner"><div class="card-face card-back"><div class="card-back-in"></div></div><div class="card-face card-front ${c.c}"><div class="cc top"><span class="cc-r">${c.r}</span><span class="cc-s">${c.s}</span></div><div class="cc-big">${c.s}</div><div class="cc bot"><span class="cc-r">${c.r}</span><span class="cc-s">${c.s}</span></div></div></div>`;
    e.style.cssText=`opacity:0;transform:translateX(${SX[i]}px)`;
    t.appendChild(e);e.addEventListener('click',()=>{rTap();pick(i)});
  });
}

function mvC(ci,sl,dur,ay,rot){
  const e=cEl(ci);if(!e)return;e.classList.add('shuffling');
  e.style.transition=`transform ${dur}ms cubic-bezier(.45,0,.55,1)`;
  e.style.transform=`translateX(${SX[sl]}px) translateY(${ay||0}px) rotate(${rot||0}deg)`;
  setTimeout(()=>{e.style.transform=`translateX(${SX[sl]}px)`;e.classList.remove('shuffling')},dur+20);
}

function deal(){
  phase='deal';const els=[...document.querySelectorAll('.card-slot')];
  els.forEach((e,i)=>{e.style.transition='none';e.style.transform='translateY(310px) rotate(8deg) scale(.5)';e.style.opacity='0';
  setTimeout(()=>{e.style.transition='transform .55s cubic-bezier(.22,1,.36,1),opacity .3s ease';e.style.opacity='1';e.style.transform=`translateX(${SX[i]}px)`;sFlip();hTap()},170+i*190)});
  setTimeout(rev,1000);
}

function rev(){
  phase='rev';cEl(0).classList.add('tell');
  [0,1,2].forEach((ci,i)=>setTimeout(()=>{cEl(ci).querySelector('.card-inner').classList.add('flipped');sFlip();hTap()},i*170));
  setTimeout(()=>{[0,1,2].forEach((ci,i)=>setTimeout(()=>{cEl(ci).querySelector('.card-inner').classList.remove('flipped');sFlip()},i*110));
  setTimeout(()=>{cEl(0).classList.remove('tell');shuf()},450)},2000);
}

function shuf(){
  phase='shuf';const ops=[];
  [{n:3,g:400},{n:4,g:280},{n:3,g:195}].forEach(p=>{for(let i=0;i<p.n;i++){const a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;ops.push({a,b,d:p.g*.7,g:p.g})}});
  let t=0;ops.forEach(o=>{setTimeout(()=>doSwap(o.a,o.b,o.d),t);t+=o.g});
  setTimeout(()=>{phase='pick';setTimeout(()=>cEl(0).classList.add('tell'),180)},t+100);
}

function doSwap(a,b,d){
  const cA=slots[a],cB=slots[b],dir=b>a?1:-1;
  mvC(cA,b,d,-15*dir,dir*3.5);mvC(cB,a,d,15*dir,-dir*3.5);
  sShuf();slots[a]=cB;slots[b]=cA;
}

function pick(ci){
  if(phase!=='pick')return;phase='done';
  const el=cEl(ci);hTap();vP(el);
  // The con: always Ace
  const f=el.querySelector('.card-front');
  f.className='card-face card-front black';
  f.innerHTML=`<div class="cc top"><span class="cc-r">A</span><span class="cc-s">♠</span></div><div class="cc-big">♠</div><div class="cc bot"><span class="cc-r">A</span><span class="cc-s">♠</span></div>`;
  el.querySelector('.card-inner').classList.add('flipped');el.classList.remove('tell');sFlip();
  setTimeout(()=>{sChime();hSuc();fireConf();showSuc(ci)},600);
}

function fireConf(){
  const b=document.getElementById('confBox'),cols=['#c9a84c','#8b5cf6','#a78bfa','#e8d48b','#f43f5e','#fff'];
  for(let i=0;i<50;i++){const p=document.createElement('div');p.className='conf-p';const sz=Math.random()*7+4,cr=Math.random()>.5;
  p.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${cr?sz:sz*.4}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${cr?'50%':'2px'};animation-duration:${Math.random()*1.3+1.3}s;animation-delay:${Math.random()*.2}s`;
  b.appendChild(p)}setTimeout(()=>b.innerHTML='',3200);
}

function showSuc(ci){
  const ov=document.getElementById('sucOv');ov.classList.add('on');
  const fl=document.getElementById('pf'),pc=document.getElementById('pp'),st=document.getElementById('ps');
  const msgs=[{a:0,t:'Verifying result…'},{a:18,t:'Authenticating…'},{a:45,t:'Connecting to prize server…'},{a:72,t:'Reserving reward…'},{a:92,t:'Finalizing…'},{a:100,t:'Done ✓'}];
  let p=0;
  const iv=setInterval(()=>{p+=Math.random()*3.2+1.1;if(p>100)p=100;const r=Math.round(p);
  fl.style.width=r+'%';pc.textContent=r+'%';sTick();
  const m=msgs.filter(x=>x.a<=r).pop();if(m)st.textContent=m.t;
  if(p>=100){clearInterval(iv);setTimeout(()=>launchVid(ci),300)}},50);
}

// ===== VIDEO IN CARD =====
function launchVid(ci){
  document.getElementById('sucOv').classList.remove('on');
  const el=cEl(ci),inner=el.querySelector('.card-inner');

  // Remove old front, add video face
  const old=el.querySelector('.card-front');if(old)old.remove();
  const vf=document.createElement('div');vf.className='card-face card-vid';
  vf.innerHTML=`<iframe src="https://www.youtube.com/embed/${VID}?autoplay=1&rel=0&playsinline=1&mute=0&controls=0&modestbranding=1&loop=1&playlist=${VID}" allow="autoplay;fullscreen;encrypted-media" allowfullscreen frameborder="0"></iframe>`;
  inner.appendChild(vf);
  inner.classList.add('flipped');

  // Fade other cards & header
  document.querySelectorAll('.card-slot').forEach(c=>{if(c!==el){c.style.transition='opacity .4s ease';c.style.opacity='0'}});
  document.getElementById('s2hdr').style.cssText='transition:opacity .3s ease;opacity:0';

  // Expand card to fill screen
  setTimeout(()=>expandCard(el),700);
}

function expandCard(el){
  const rect=el.getBoundingClientRect();
  const vw=innerWidth,vh=innerHeight;
  const sx=vw/rect.width,sy=vh/rect.height,scale=Math.max(sx,sy);
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const dx=vw/2-cx,dy=vh/2-cy;

  // Get current translateX
  const m=el.style.transform.match(/translateX\(([^)]+)\)/);
  const curX=m?parseFloat(m[1]):0;

  el.style.zIndex='100';
  el.style.transition='transform .85s cubic-bezier(.4,0,.2,1)';
  el.style.transform=`translateX(${curX+dx}px) translateY(${dy}px) scale(${scale})`;

  // After expansion, swap to true fullscreen
  setTimeout(()=>{
    showScr(3);
    document.getElementById('fsVid').innerHTML=`<iframe src="https://www.youtube.com/embed/${VID}?autoplay=1&rel=0&playsinline=1&mute=0&controls=1&modestbranding=1&loop=1&playlist=${VID}" allow="autoplay;fullscreen;encrypted-media" allowfullscreen frameborder="0" style="width:100%;height:100%;border:none"></iframe>`;
  },950);
}
